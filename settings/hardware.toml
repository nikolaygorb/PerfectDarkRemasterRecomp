# wetrecomp - hardware / rendering settings
#
# Loaded automatically at startup (see OnConfigurePaths in
# src/wetrecomp_app.h) and rewritten by the in-game Settings overlay's
# "Save to config" button. --flag on the command line and REX_* environment
# variables always override values from this file - see ../settings/README.md.
#
# Flat key = value only

gpu_plugin = "xenos"
# Graphics API backend rexgpu-xenos loads: "any" (D3D12 first), "d3d12", or
# "vulkan". Project-defined cvar, see OnPreSetup in src/wetrecomp_app.h.
graphics_backend = "any"
vsync = true
resolution_scale = 1
async_shader_compilation = true
native_2x_msaa = true
anisotropic_override = 0

window_width = 1920
window_height = 1080
fullscreen = true
monitor = 0
resolution = "1920x1080"

present_letterbox = true

d3d12_debug = false

# Experimental: ported xenia-canary game-patches "60 FPS" patch for WET.
# Off by default (matches upstream) - can affect physics/animation timing.
# Project-defined cvar, see generated/default/wetrecomp_recomp.218.cpp.
wet_fps60_unlock = true

# Experimental: ported xenia-canary game-patches "Fix texture noise on
# NVIDIA GPUs" patch for Perfect Dark (584109C2). Off by default (matches
# upstream). Project-defined cvar, applied as a direct guest-memory write
# in OnPostLoadXexImage() in src/perfectdarkremasterrecomp_app.h.
pdr_texture_noise_fix = true

# XBLA license bypass. SDK cvar (rexglue-sdk/src/kernel/xam/xam_content.cpp)
# read by XamContentGetLicenseMask_entry. Default 0 means "no licenses" so
# XBLA titles show "UNLOCK FULL VERSION" banner. Set to 0xFFFFFFFF to claim
# every license bit is granted.
license_mask = 4294967295

# SDK cvar (rexglue-sdk/src/kernel/xam/xam_ui.cpp). When true, XamShowMessageBoxUI
# and friends auto-pick the active button instead of showing an ImGui dialog.
# Suppresses the "profile not signed in" prompt at startup.
headless = false

# Remove once done - this produces a much larger log file per run.
#log_level = "trace"
#log_noisy = true