# PerfectDarkRemasterRecomp - hardware / rendering settings
#
# Loaded automatically at startup (see OnConfigurePaths in
# src/perfectdarkremasterrecomp_app.h) and rewritten by the in-game Settings overlay's
# "Save to config" button. --flag on the command line and REX_* environment
# variables always override values from this file - see ../settings/README.md.
#
# Flat key = value only

gpu_plugin = "xenos"
# Graphics API backend rexgpu-xenos loads: "any" (D3D12 first), "d3d12", or
# "vulkan". Project-defined cvar, see OnPreSetup in src/perfectdarkremasterrecomp_app.h.
graphics_backend = "any"
vsync = false
resolution_scale = 1
async_shader_compilation = true
native_2x_msaa = false
anisotropic_override = 0

window_width = 1920
window_height = 1080
fullscreen = true
monitor = 0
resolution = "1920x1080"

render_target_path_d3d12 = "rtv"
store_shaders = true
present_letterbox = true
  
d3d12_adapter = -1
d3d12_allow_variable_refresh_rate_and_tearing = true
d3d12_bindless = true
d3d12_break_on_error = false
d3d12_break_on_warning = false
d3d12_debug = false
d3d12_dxbc_disasm = false
d3d12_dxbc_disasm_dxilconv = false
d3d12_pipeline_creation_threads = -1
d3d12_queue_priority = 1
d3d12_submit_on_primary_buffer_end = true
d3d12_tessellation_wireframe = false

render_target_path_vulkan = "fbo"
vulkan_log_debug_messages = false
vulkan_allow_present_mode_immediate = true
vulkan_allow_present_mode_fifo_relaxed = false
vulkan_allow_present_mode_mailbox = false

# Experimental: ported xenia-canary game-patches "Fix texture noise on
# NVIDIA GPUs" patch for Perfect Dark (584109C2). Off by default (matches
# upstream). Project-defined cvar, applied as a direct guest-memory write
# in OnPostLoadXexImage() in src/perfectdarkremasterrecomp_app.h.
pdr_texture_noise_fix = true

# XBLA license bypass. SDK cvar (rexglue-sdk/src/kernel/xam/xam_content.cpp)
# read by XamContentGetLicenseMask_entry. Default 0 means "no licenses" so
# XBLA titles show "UNLOCK FULL VERSION" banner. Set to 0xFFFFFFFF to claim
# every license bit is granted.
license_mask = 4294967295

# SDK cvar (rexglue-sdk/src/kernel/xam/xam_ui.cpp). When true, XamShowMessageBoxUI
# and friends auto-pick the active button instead of showing an ImGui dialog.
# Suppresses the "profile not signed in" prompt at startup.
headless = false

# Remove once done - this produces a much larger log file per run.
#log_level = "trace"
#log_level = "error"

# texture fetch constant has invalid type
gpu_allow_invalid_fetch_constants = true

# Perf CSV log path (per-frame metrics). Empty = disabled.
# Only works when REXGLUE_ENABLE_PERF_COUNTERS is defined (non-Release).
#perf_log_csv = "benchmark.csv"

# Enable runtime debug tools (stub sweep, missing function scan).
# Produces logs/missed_functions.txt and logs/stub_sweep.txt.
dev_debug_runtime = false